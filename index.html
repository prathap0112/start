<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prathap Start Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Pirata+One&display=swap">
<style>
:root{--ink:#f6efe6;--muted:#c9b9a6;--line:rgba(255,210,140,.16);--panel:rgba(14,8,10,.55);--panel2:rgba(255,220,170,.07);--red:#e0283c;--gold:#f4b63f;--ember:#ff7a2e}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:#07050a;color:var(--ink);font:15px/1.45 Inter,"Segoe UI",system-ui,sans-serif;overflow:hidden}
a{color:inherit;text-decoration:none}
.wall{position:fixed;inset:-24px;background-color:#07050a;background-image:url("wallpaper.webp"),url("wallpaper.jpg"),url("straw-hat-luffy-one-3840x2160-22500.jpg");background-position:center 30%;background-size:cover;background-repeat:no-repeat;transform:translate3d(var(--px,0),var(--py,0),0) scale(1.02);transition:transform .6s ease-out;animation:breathe 14s ease-in-out infinite alternate}
@keyframes breathe{to{filter:brightness(1.08) saturate(1.08)}}
.shade{position:fixed;inset:0;background:linear-gradient(90deg,rgba(5,3,6,.72) 0,rgba(5,3,6,.15) 30%,rgba(5,3,6,0) 50%,rgba(5,3,6,.15) 70%,rgba(5,3,6,.72) 100%),radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.45) 100%)}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
.app{position:relative;z-index:1;height:100vh;display:grid;grid-template-columns:minmax(280px,340px) 1fr minmax(300px,360px);gap:20px;padding:20px 22px}
.col{display:flex;flex-direction:column;gap:12px;overflow:auto;scrollbar-width:none}
.col::-webkit-scrollbar{display:none}
.mid{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:4px}
.glass{background:var(--panel);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px -20px rgba(0,0,0,.8)}
.card{padding:14px 16px;animation:rise .6s ease both}
.col .card:nth-child(2){animation-delay:.08s}.col .card:nth-child(3){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h2{margin:0 0 8px;font:600 12.5px Inter;color:var(--muted);display:flex;align-items:center;gap:7px;letter-spacing:.2px}
h2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.greet{font:400 20px "Pirata One",serif;color:var(--gold);letter-spacing:.4px}
.time{font:600 clamp(52px,5.4vw,76px)/.95 "Space Grotesk",sans-serif;letter-spacing:-2px;font-variant-numeric:tabular-nums;margin:4px 0 2px;text-shadow:0 0 30px rgba(224,40,60,.35)}
.time .sec{font-size:.36em;letter-spacing:0;color:var(--red);margin-left:6px;vertical-align:top;position:relative;top:.3em}
.time .ap{font-size:.3em;letter-spacing:0;color:var(--muted);margin-left:4px}
.date{font:500 14px "Space Grotesk"}
.prog-l{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:10px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--red),var(--ember),var(--gold),var(--red));background-size:300% 100%;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.zones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.zone{background:var(--panel2);border-radius:10px;padding:5px 7px}
.zone b{display:block;font:600 14px "Space Grotesk";font-variant-numeric:tabular-nums}
.zone span{font-size:11px;color:var(--muted)}
.wx-top{display:flex;align-items:center;gap:10px}
.wx-ico{width:58px;height:58px;flex:none}
.wx-t{font:600 40px/1 "Space Grotesk";letter-spacing:-1px}
.wx-c{font-size:13.5px}
.wx-loc{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wx-loc button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:2px 7px;font:500 11.5px Inter;cursor:pointer}
.wx-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.st{background:var(--panel2);border-radius:10px;padding:5px 8px}
.st small{display:block;font-size:11px;color:var(--muted)}
.st b{font:600 13.5px "Space Grotesk";white-space:nowrap}
.hours{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:8px}
.hr{text-align:center;background:var(--panel2);border-radius:10px;padding:5px 2px;font-size:11px}
.hr svg{width:22px;height:22px;display:block;margin:2px auto}
.hr b{font:600 13px "Space Grotesk"}
.search{display:flex;gap:8px;padding:8px}
.search input{flex:1;font:15px Inter;padding:8px 10px;border:0;background:transparent;color:var(--ink);outline:none;min-height:40px}
.search input::placeholder{color:#a8988a}
.go{display:inline-flex;align-items:center;padding:0 16px;border-radius:12px;background:linear-gradient(135deg,var(--red),var(--ember));color:#fff;font-weight:600;min-height:40px;box-shadow:0 0 18px -4px var(--red)}
.hint{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px;color:var(--muted);padding:0 4px}
.hint b{color:var(--gold);font-family:"Space Grotesk"}
.dest{color:var(--gold);font-size:11.5px;min-height:15px;padding:0 4px}
.pins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.pin{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px 7px;border-radius:12px;background:var(--panel2);border:1px solid transparent;font-size:11.5px;transition:transform .18s,border-color .18s,box-shadow .18s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 8px 20px -8px var(--c)}
.av{position:relative;overflow:hidden;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font:600 13px "Space Grotesk";color:#fff}
.av img,.dot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:3px;background:#fff;opacity:0}
.av.img img,.dot.img img{opacity:1}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.tab{font:500 12px Inter;padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;min-height:28px}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--gold);border-color:var(--gold);color:#1a0d05}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 8px;min-height:148px;align-content:start}
.l{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;font-size:13px;transition:background .15s,transform .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l:hover{background:var(--panel2);transform:translateX(2px)}
.dot{position:relative;overflow:hidden;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font:600 10px "Space Grotesk";color:#fff;flex:none}
.timer{display:flex;align-items:center;gap:12px}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font:600 14px "Space Grotesk";font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:5px}
button.b{font:500 12.5px Inter;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:0 10px;min-height:32px;cursor:pointer}
button.b:hover{border-color:var(--gold)}button.b.on{background:var(--red);border-color:var(--red);color:#fff}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.quote{font:400 clamp(17px,1.5vw,22px)/1.3 "Pirata One",serif;color:#ffe2b0;text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.9);max-width:520px}
.quote small{display:block;font:12px Inter;color:var(--muted);margin-top:4px}
.keys{display:flex;gap:6px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.keys a{padding:4px 10px;border-radius:99px;background:rgba(10,5,8,.55);border:1px solid var(--line)}
.keys a:hover{color:var(--ink);border-color:var(--gold)}
@media(max-height:720px) and (min-width:1101px){.app{padding:12px 16px;gap:14px}.col{gap:8px}.card{padding:10px 13px}.time{font-size:50px}.hint{display:none}.hours{display:none}.prog-l{margin-top:6px}.zones{margin-top:7px}.wx-grid{margin-top:7px}.pin{padding:6px 2px 5px}.links{min-height:0}.wx-ico{width:48px;height:48px}.wx-t{font-size:34px}}
@media(max-width:1100px){body{overflow:auto}.app{height:auto;grid-template-columns:1fr}.mid{order:3;min-height:40vh}.shade{background:rgba(5,3,6,.55)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.spin{transform-origin:32px 30px;animation:spin 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{to{transform:translateX(4px)}}
.drop{animation:drop 1s linear infinite}@keyframes drop{from{transform:translateY(-3px);opacity:0}40%{opacity:1}to{transform:translateY(6px);opacity:0}}
.flash{animation:flash 2.4s infinite}@keyframes flash{0%,80%,100%{opacity:1}85%,95%{opacity:.2}}
</style>
</head>
<body>
<div class="wall" id="wall" aria-hidden="true"></div>
<div class="shade" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="app">
  <aside class="col">
    <section class="glass card" aria-label="Clock">
      <div class="greet" id="greet">Ahoy, Captain Prathap</div>
      <div class="time" id="time">--:--</div>
      <div class="date" id="date"></div>
      <div class="prog-l"><span id="dayl">Day progress</span><span id="dayp"></span></div>
      <div class="bar"><i id="dayb" style="width:0"></i></div>
      <div class="zones" id="zones"></div>
    </section>
    <section class="glass card" aria-label="Weather" aria-live="polite">
      <div class="wx-top">
        <div class="wx-ico" id="wxi"></div>
        <div>
          <div class="wx-t" id="wxt">--°</div>
          <div class="wx-c" id="wxc">Loading weather…</div>
          <div class="wx-loc"><span id="wxl">Chennai</span><button id="loc" type="button">Use my location</button></div>
        </div>
      </div>
      <div class="wx-grid" id="wxg"></div>
      <div class="hours" id="hours"></div>
    </section>
    <section class="glass card">
      <h2>Focus timer</h2>
      <div class="timer">
        <div class="ring"><svg viewBox="0 0 120 120"><defs><linearGradient id="rg"><stop offset="0" stop-color="#f4b63f"/><stop offset="1" stop-color="#e0283c"/></linearGradient></defs><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="10"/><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg><div class="t" id="tm">25:00</div></div>
        <div>
          <div class="btns"><button class="b on" data-min="25">25</button><button class="b" data-min="5">5</button><button class="b" data-min="15">15</button></div>
          <div class="btns" style="margin-top:5px"><button class="b" id="tstart">Start</button><button class="b" id="treset">Reset</button></div>
        </div>
      </div>
    </section>
  </aside>

  <div class="mid">
    <div class="quote" id="quote"></div>
    <nav class="keys" aria-label="Tasks and notes">
      <a href="https://tasks.google.com/">Google Tasks</a><a href="https://keep.google.com/">Keep</a><a href="https://calendar.google.com/calendar/r/day">Today's calendar</a>
    </nav>
  </div>

  <aside class="col">
    <div>
      <form class="search glass" id="sf">
        <input id="q" placeholder="Search Google, or yt · gh · pub · ig …" autocomplete="off" aria-label="Search" autofocus>
        <a class="go" id="go" href="https://www.google.com/">Search</a>
      </form>
      <div class="dest" id="dest"></div>
      <div class="hint" id="hint"></div>
    </div>
    <section class="glass card">
      <h2>Quick launch</h2>
      <nav class="pins" id="pins"></nav>
    </section>
    <section class="glass card">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="links" id="links" role="tabpanel"></div>
    </section>
  </aside>
</div>

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('sp_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('sp_'+k,JSON.stringify(v))}catch(e){}}};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const pal=['#e0283c','#0ea5a4','#7c3aed','#ea580c','#16a34a','#2563eb','#db2777','#0891b2','#ca8a04'];
const col=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return pal[h%pal.length]};
const ico=u=>{try{return 'https://www.google.com/s2/favicons?sz=64&domain='+new URL(u).hostname}catch(e){return ''}};
const badge=(cls,n,u,c)=>`<span class="${cls}" style="background:${c||col(n)}">${esc(n[0])}<img src="${ico(u)}" alt="" onload="this.parentNode.classList.add('img')" onerror="this.remove()"></span>`;

const engines={yt:['YouTube','https://www.youtube.com/results?search_query=%s'],gh:['GitHub','https://github.com/search?q=%s'],pub:['pub.dev','https://pub.dev/packages?q=%s'],fl:['Flutter','https://docs.flutter.dev/search?q=%s'],aws:['AWS','https://docs.aws.amazon.com/search/doc-search.html?searchQuery=%s'],so:['StackOverflow','https://stackoverflow.com/search?q=%s'],gpt:['ChatGPT','https://chatgpt.com/?q=%s'],ig:['Instagram','https://www.instagram.com/explore/search/keyword/?q=%s'],m:['Maps','https://www.google.com/maps/search/%s'],tr:['Translate','https://translate.google.com/?sl=auto&tl=en&text=%s']};
const q=$('q'),go=$('go');
$('hint').innerHTML=Object.entries(engines).map(([k,v])=>`<span><b>${k}</b> ${esc(v[0])}</span>`).join('');
function resolve(s){s=s.trim();if(!s)return['https://www.google.com/',''];
  const sp=s.indexOf(' '),key=sp>0?s.slice(0,sp).toLowerCase():'',rest=sp>0?s.slice(sp+1).trim():'';
  if(engines[key]&&rest)return[engines[key][1].replace('%s',encodeURIComponent(rest)),engines[key][0]];
  if(!s.includes(' ')&&/^(https?:\/\/)?[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(s))return[s.startsWith('http')?s:'https://'+s,'Open site'];
  return['https://www.google.com/search?q='+encodeURIComponent(s),'Google']}
q.addEventListener('input',()=>{const[u,l]=resolve(q.value);go.href=u;$('dest').textContent=q.value.trim()?'→ '+l:''});
$('sf').addEventListener('submit',e=>{e.preventDefault();location.href=resolve(q.value)[0]});
document.addEventListener('keydown',e=>{const t=document.activeElement.tagName;if(e.key==='/'&&t!=='INPUT'&&t!=='TEXTAREA'){e.preventDefault();q.focus()}});

const pins=[['ChatGPT','https://chat.openai.com/','#10a37f'],['Gemini','https://gemini.google.com/app','#4f8cff'],['Gmail','https://mail.google.com/','#ea4335'],['Calendar','https://calendar.google.com/','#1a73e8'],['Drive','https://drive.google.com/','#fbbc04'],['GitHub','https://github.com/','#a78bfa'],['Instagram','https://www.instagram.com/','#e1306c'],['Business','https://business.facebook.com/latest/home','#0866ff'],['AWS','https://console.aws.amazon.com/','#ff9900'],['YouTube','https://www.youtube.com/','#ff0033'],['Maps','https://maps.google.com/','#34a853'],['Hotstar','https://www.hotstar.com/','#1f80e0']];
$('pins').innerHTML=pins.map(([n,u,c])=>`<a class="pin" href="${esc(u)}" style="--c:${c}" title="${esc(n)}">${badge('av',n,u,c)}${esc(n)}</a>`).join('');

const cats=[
 ['Dev',[['DartPad','https://dartpad.dev/'],['JSON to Dart','https://jsontodart.com/'],['Crontab.guru','https://crontab.guru/'],['EmailJS','https://dashboard.emailjs.com/admin'],['FlutterFire','https://github.com/firebase/flutterfire'],['AppIcon','https://appicon.co/'],['Midjourney','https://midjourney.com/'],['Flutter widgets','https://docs.flutter.dev/ui/widgets']]],
 ['Social',[['Instagram','https://www.instagram.com/'],['Business Suite','https://business.facebook.com/latest/home'],['BS – Inbox','https://business.facebook.com/latest/inbox'],['BS – Insights','https://business.facebook.com/latest/insights'],['Ads Manager','https://adsmanager.facebook.com/'],['Facebook','https://www.facebook.com/']]],
 ['Learn',[['Flutter widgets','https://docs.flutter.dev/ui/widgets'],['Dart tour','https://dart.dev/language'],['Udemy Flutter','https://www.udemy.com/course/flutter-bootcamp-with-dart/'],['AWS mock test','https://trustedinstitute.com/practice/aws-solution-architect/'],['Coursera UX','https://www.coursera.org/learn/foundations-user-experience-design']]],
 ['Design',[['Awwwards','https://www.awwwards.com/websites/sites_of_the_day/'],['Smashing Mag','https://www.smashingmagazine.com/'],['Icons8','https://icons8.com/'],['Pexels','https://www.pexels.com/'],['Poly Haven','https://polyhaven.com/'],['Mr.Mockup','https://mrmockup.com/free-mockups/']]],
 ['Career',[['Work in Finland','https://www.workinfinland.com/en/open-jobs/'],['Europass CV','https://europass.europa.eu/en/create-europass-cv'],['Canada CRS','https://www.cic.gc.ca/english/immigrate/skilled/crs-tool.asp'],['Canada.ca','https://www.canada.ca/en.html']]],
 ['Accounts',[['ACT Fibernet','https://selfcare.actcorp.in/group/chn/myaccount'],['Saral ESS','https://ess.arcfertility.in/'],['iCloud','https://www.icloud.com/'],['Acrobat','https://acrobat.adobe.com/']]],
 ['Unwind',[['Hotstar','https://www.hotstar.com/'],['LiveChart','https://www.livechart.me/'],['HoYoLAB','https://www.hoyolab.com/home'],['Zomato','https://www.zomato.com/'],['NDTV','https://www.ndtv.com/']]]];
let cur=store.get('tab',0);if(!cats[cur])cur=0;
function renderTabs(){
  $('tabs').innerHTML=cats.map(([t],i)=>`<button class="tab${i===cur?' on':''}" role="tab" aria-selected="${i===cur}" data-i="${i}">${esc(t)}</button>`).join('');
  $('links').innerHTML=cats[cur][1].map(([n,u])=>`<a class="l" href="${esc(u)}" title="${esc(n)}">${badge('dot',n,u)}${esc(n)}</a>`).join('')}
const pick=i=>{if(i===undefined||+i===cur)return;cur=+i;store.set('tab',cur);renderTabs()};
$('tabs').addEventListener('click',e=>pick(e.target.dataset.i));
$('tabs').addEventListener('mouseover',e=>pick(e.target.dataset.i));
renderTabs();

const quotes=[['A smooth sea never made a skilled sailor.','Proverb'],['Simplicity is prerequisite for reliability.','Edsger Dijkstra'],['Make it work, make it right, make it fast.','Kent Beck'],['The best way to predict the future is to invent it.','Alan Kay'],['Well begun is half done.','Aristotle'],['First, solve the problem. Then, write the code.','John Johnson'],['The pessimist complains about the wind; the optimist adjusts the sails.','William A. Ward'],['It always seems impossible until it is done.','Nelson Mandela'],['Focus on being productive instead of busy.','Tim Ferriss']];
{const d=new Date(),k=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5)%quotes.length;$('quote').innerHTML=`“${esc(quotes[k][0])}”<small>— ${esc(quotes[k][1])}</small>`}

let sunrise=null,sunset=null;
const zones=[['Chennai','Asia/Kolkata'],['Helsinki','Europe/Helsinki'],['Toronto','America/Toronto'],['London','Europe/London']];
function tick(){
  const d=new Date(),h=d.getHours();
  const p=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}).split(/[: ]/);
  $('time').innerHTML=`${p[0]}:${p[1]}<span class="sec">${p[2]}</span><span class="ap">${p[3]}</span>`;
  $('greet').textContent=(h<5?'Night watch':h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Good night')+', Captain Prathap';
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));const wk=Math.ceil(((t-Date.UTC(t.getUTCFullYear(),0,1))/864e5+1)/7);
  $('date').textContent=d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})+' · Week '+wk;
  const pct=(h*3600+d.getMinutes()*60+d.getSeconds())/864;
  let lbl='Day progress';
  if(sunset&&sunrise){const ms=sunset-d;if(d>sunrise&&ms>0)lbl=`Daylight left ${Math.floor(ms/36e5)}h ${Math.round(ms%36e5/6e4)}m`;else lbl='Night watch'}
  $('dayl').textContent=lbl;$('dayp').textContent=Math.floor(pct)+'% of day';$('dayb').style.width=pct+'%';
  $('zones').innerHTML=zones.map(([n,z])=>`<div class="zone"><b>${d.toLocaleTimeString('en-GB',{timeZone:z,hour:'2-digit',minute:'2-digit'})}</b><span>${n}</span></div>`).join('');
}
tick();setInterval(tick,1000);

const WMO={0:['Clear sky','clear'],1:['Mainly clear','clear'],2:['Partly cloudy','partly'],3:['Overcast','cloudy'],45:['Fog','fog'],48:['Rime fog','fog'],51:['Light drizzle','rain'],53:['Drizzle','rain'],55:['Heavy drizzle','rain'],61:['Light rain','rain'],63:['Rain','rain'],65:['Heavy rain','rain'],66:['Freezing rain','rain'],67:['Freezing rain','rain'],71:['Light snow','snow'],73:['Snow','snow'],75:['Heavy snow','snow'],77:['Snow grains','snow'],80:['Rain showers','rain'],81:['Rain showers','rain'],82:['Violent showers','rain'],85:['Snow showers','snow'],86:['Snow showers','snow'],95:['Thunderstorm','storm'],96:['Thunderstorm, hail','storm'],99:['Thunderstorm, hail','storm']};
function icon(kind,day){
  const sun=`<g class="spin"><circle cx="32" cy="30" r="11" fill="#f4b63f"/>${[0,45,90,135,180,225,270,315].map(a=>`<rect x="31" y="11" width="2.4" height="6" rx="1.2" fill="#f4b63f" transform="rotate(${a} 32 30)"/>`).join('')}</g>`;
  const moon=`<path d="M38 16a14 14 0 1 0 8 24 12 12 0 0 1-8-24z" fill="#f3e9da"/>`;
  const cloud=(x,y,c)=>`<g class="drift"><path d="M${x} ${y}h26a9 9 0 0 0 0-18 12 12 0 0 0-23-2 8 8 0 0 0-3 20z" fill="${c}"/></g>`;
  const body=day?sun:moon;
  if(kind==='clear')return `<svg viewBox="0 0 64 64">${body}</svg>`;
  if(kind==='partly')return `<svg viewBox="0 0 64 64"><g transform="translate(-6,-6)">${body}</g>${cloud(18,50,'#efe7dc')}</svg>`;
  if(kind==='cloudy')return `<svg viewBox="0 0 64 64">${cloud(10,38,'#b8aea4')}${cloud(20,48,'#eee6dc')}</svg>`;
  if(kind==='fog')return `<svg viewBox="0 0 64 64">${cloud(14,36,'#ddd4ca')}${[44,50,56].map((y,i)=>`<rect x="${10+i*3}" y="${y}" width="${42-i*6}" height="3" rx="1.5" fill="#cfc5ba" class="drift"/>`).join('')}</svg>`;
  const drops=kind==='snow'?[18,30,42].map((x,i)=>`<circle cx="${x}" cy="50" r="2.6" fill="#fff" class="drop" style="animation-delay:${i*.3}s"/>`).join(''):[18,28,38,48].map((x,i)=>`<rect x="${x}" y="46" width="2.6" height="8" rx="1.3" fill="#8cc8ff" class="drop" style="animation-delay:${i*.25}s"/>`).join('');
  const bolt=kind==='storm'?`<path d="M34 40l-7 11h6l-3 9 9-13h-6l4-7z" fill="#f4b63f" class="flash"/>`:'';
  return `<svg viewBox="0 0 64 64">${cloud(14,40,'#ddd4ca')}${drops}${bolt}</svg>`;
}
const DEF={lat:13.0827,lon:80.2707,name:'Chennai'};
let place=store.get('place',DEF),wxKind='clear';
const aqiTxt=a=>a<=50?'Good':a<=100?'Moderate':a<=150?'Sensitive':a<=200?'Unhealthy':'Very poor';
const hm=s=>new Date(s).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
async function loadWx(){
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,weather_code,is_day&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=2`;
    const w=await (await fetch(u)).json(),c=w.current;
    const [txt,kind]=WMO[c.weather_code]||['—','cloudy'];
    wxKind=kind;buildDrops();
    sunrise=new Date(w.daily.sunrise[0]);sunset=new Date(w.daily.sunset[0]);
    $('wxi').innerHTML=icon(kind,!!c.is_day);
    $('wxt').textContent=Math.round(c.temperature_2m)+'°';
    $('wxc').textContent=`${txt} · Feels ${Math.round(c.apparent_temperature)}°`;
    $('wxl').textContent=place.name;
    let aq='—';
    try{const a=await (await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${place.lat}&longitude=${place.lon}&current=us_aqi`)).json();if(a.current&&a.current.us_aqi!=null)aq=`${Math.round(a.current.us_aqi)} ${aqiTxt(a.current.us_aqi)}`}catch(e){}
    const st=[['High / Low',`${Math.round(w.daily.temperature_2m_max[0])}° / ${Math.round(w.daily.temperature_2m_min[0])}°`],['Humidity',c.relative_humidity_2m+'%'],['Wind',Math.round(c.wind_speed_10m)+' km/h'],['Sunrise',hm(w.daily.sunrise[0])],['Sunset',hm(w.daily.sunset[0])],['Air',aq]];
    $('wxg').innerHTML=st.map(([k,v])=>`<div class="st"><small>${k}</small><b>${esc(v)}</b></div>`).join('');
    const now=Date.now();let i0=w.hourly.time.findIndex(t=>new Date(t).getTime()>now-36e5);if(i0<0)i0=0;
    $('hours').innerHTML=[0,1,2,3,4,5].map(j=>{const i=i0+j*2,k=(WMO[w.hourly.weather_code[i]]||['','cloudy'])[1];
      return `<div class="hr">${j?new Date(w.hourly.time[i]).toLocaleTimeString('en-US',{hour:'numeric'}):'Now'}${icon(k,w.hourly.is_day[i])}<b>${Math.round(w.hourly.temperature_2m[i])}°</b></div>`}).join('');
  }catch(e){$('wxc').textContent='Weather unavailable right now'}
}
async function nameFor(lat,lon){try{const r=await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`)).json();return r.city||r.locality||r.principalSubdivision||'Your location'}catch(e){return 'Your location'}}
function locate(){if(!navigator.geolocation)return;$('loc').textContent='Locating…';
  navigator.geolocation.getCurrentPosition(async p=>{const lat=+p.coords.latitude.toFixed(3),lon=+p.coords.longitude.toFixed(3);place={lat,lon,name:await nameFor(lat,lon)};store.set('place',place);$('loc').textContent='Update';loadWx()},
  ()=>{$('loc').textContent='Use my location'},{timeout:10000,maximumAge:36e5})}
$('loc').onclick=locate;
if(store.get('place',null))$('loc').textContent='Update';
loadWx();setInterval(loadWx,15*60*1000);
if(navigator.permissions)navigator.permissions.query({name:'geolocation'}).then(s=>{if(s.state==='granted')locate()}).catch(()=>{});

const cv=$('fx'),cx=cv.getContext('2d');let W=0,H=0,embers=[],drops=[];
function mk(any){return{x:W*(.2+Math.random()*.6)+(Math.random()-.5)*W*.3,y:any?Math.random()*H:H+10,r:.6+Math.random()*2.2,v:12+Math.random()*38,s:Math.random()*6,l:.4+Math.random()*.6,h:Math.random()<.7?28+Math.random()*20:0}}
function buildDrops(){drops=(wxKind==='rain'||wxKind==='storm'||wxKind==='snow')?Array.from({length:Math.round(W/7)},()=>({x:Math.random()*W,y:Math.random()*H,v:wxKind==='snow'?40+Math.random()*30:520+Math.random()*200})):[]}
function size(){const dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  embers=Array.from({length:Math.round(W/16)},()=>mk(true));buildDrops()}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000),tt=now/1000;last=now;cx.clearRect(0,0,W,H);
  cx.globalCompositeOperation='lighter';
  for(const e of embers){e.y-=e.v*dt;e.x+=Math.sin(tt*1.3+e.s)*12*dt;if(e.y<-10)Object.assign(e,mk(false));
    const a=e.l*(.55+.45*Math.sin(tt*4+e.s))*Math.max(0,Math.min(1,e.y/(H*.25)));
    const g=cx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r*4);g.addColorStop(0,`hsla(${e.h},100%,65%,${a})`);g.addColorStop(1,`hsla(${e.h},100%,50%,0)`);
    cx.fillStyle=g;cx.beginPath();cx.arc(e.x,e.y,e.r*4,0,7);cx.fill()}
  cx.globalCompositeOperation='source-over';
  if(drops.length){cx.strokeStyle=wxKind==='snow'?'rgba(255,255,255,.85)':'rgba(190,210,255,.35)';cx.fillStyle='#fff';cx.lineWidth=1.1;cx.beginPath();
    for(const d of drops){d.y+=d.v*dt;d.x-=d.v*dt/10;if(d.y>H){d.y=-10;d.x=Math.random()*W}
      if(wxKind==='snow'){cx.moveTo(d.x+2,d.y);cx.arc(d.x,d.y,2,0,7)}else{cx.moveTo(d.x,d.y);cx.lineTo(d.x-1.4,d.y+12)}}
    wxKind==='snow'?cx.fill():cx.stroke();
    if(wxKind==='storm'&&Math.sin(tt*.9)>.996){cx.fillStyle='rgba(255,255,255,.25)';cx.fillRect(0,0,W,H)}}
  requestAnimationFrame(frame)}
addEventListener('resize',size);size();
if(!RM){requestAnimationFrame(frame);
  const wall=$('wall');addEventListener('mousemove',e=>{wall.style.setProperty('--px',((e.clientX/W-.5)*-14)+'px');wall.style.setProperty('--py',((e.clientY/H-.5)*-10)+'px')})}

let total=1500,left=total,iv=null;
const tm=$('tm'),ts=$('tstart'),arc=$('arc'),C=326.7;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const show=()=>{tm.textContent=fmt(left);arc.style.strokeDashoffset=C*(1-left/total);document.title=iv?fmt(left)+' · Focus':'Prathap Start Page'};
const stop=()=>{clearInterval(iv);iv=null;ts.textContent='Start';show()};
ts.onclick=()=>{if(iv){stop();return}ts.textContent='Pause';iv=setInterval(()=>{left--;show();if(left<=0){stop();left=total;tm.textContent='Done!';setTimeout(show,4000)}},1000);show()};
$('treset').onclick=()=>{stop();left=total;show()};
document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-min]').forEach(x=>x.classList.remove('on'));b.classList.add('on');stop();total=left=+b.dataset.min*60;show()});
show();
}
